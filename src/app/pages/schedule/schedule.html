<div class="schedule-page">
  <div class="schedule-page__content">
    <app-schedule-header
      [selectedDate]="selectedDate()"
      [viewMode]="viewMode()"
      (selectedDateChange)="selectedDate.set($event)"
      (viewModeChange)="viewMode.set($event)"
      (newEvent)="requestNewEvent()"
    />
    <main class="schedule-page__main">
      <app-planning
        [selectedDate]="selectedDate()"
        [viewMode]="viewMode()"
        [newEventRequest]="newEventRequest()"
        (selectedDateChange)="selectedDate.set($event)"
      />
    </main>
  </div>
</div>
