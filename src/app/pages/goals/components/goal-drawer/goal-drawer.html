<div
  class="side-drawer-backdrop"
  tabindex="-1"
  (click)="closeFromBackdrop($event)"
  (keydown.escape)="dismissed.emit()"
>
  <aside
    class="side-drawer"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="goal() ? 'Editar meta semanal' : 'Nova meta semanal'"
  >
    <header class="side-drawer__header">
      <div>
        <h2>{{ goal() ? 'Editar meta' : 'Nova meta' }}</h2>
        <p>Descreva o resultado que você quer alcançar nesta semana.</p>
      </div>
      <button
        type="button"
        class="button button--ghost button--icon"
        aria-label="Fechar drawer"
        (click)="dismissed.emit()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </header>

    <form class="side-drawer__form" (ngSubmit)="submit()">
      <label class="form-field"
        >Nome da meta <span aria-hidden="true">*</span>
        <input
          class="input-control"
          type="text"
          name="goal-title"
          [(ngModel)]="draft.name"
          placeholder="Ex.: Avançar no curso de Spring"
          autocomplete="off"
        />
        @if (submitted && !draft.name.trim()) {
          <small class="side-drawer__error">Informe o nome da meta.</small>
        }
      </label>

      <label class="form-field"
        >Resultado esperado <span aria-hidden="true">*</span>
        <textarea
          class="input-control textarea goal-drawer__textarea"
          name="expected-result"
          [(ngModel)]="draft.expectedTarget"
          placeholder="O que significa concluir esta meta?"
        ></textarea>
        @if (submitted && !draft.expectedTarget.trim()) {
          <small class="side-drawer__error">Descreva o resultado esperado.</small>
        }
      </label>

      <label class="form-field"
        >Prioridade
        <select class="input-control" name="priority" [(ngModel)]="draft.priority">
          @for (priority of options().priorities; track priority.value) {
            <option [ngValue]="priority.value">{{ priority.label }}</option>
          }
        </select>
      </label>

      <label class="form-field"
        >Categoria
        <select class="input-control" name="category" [(ngModel)]="draft.category">
          @for (category of options().categories; track category.value) {
            <option [ngValue]="category.value">{{ category.label }}</option>
          }
        </select>
      </label>

      <footer class="side-drawer__actions">
        @if (error(); as message) {
          <p class="side-drawer__error" role="alert">{{ message }}</p>
        }
        <button
          type="button"
          class="button button--secondary"
          [disabled]="saving()"
          (click)="dismissed.emit()"
        >
          Cancelar
        </button>
        <button type="submit" class="button button--primary" [disabled]="saving()">
          <mat-icon>save</mat-icon>{{ saving() ? 'Salvando...' : 'Salvar' }}
        </button>
      </footer>
    </form>
  </aside>
</div>
